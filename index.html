<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="커리어, 수상, 프로젝트를 시간순으로 모은 포트폴리오">
  <title>김현우 포트폴리오</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./entries.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body data-page="timeline" id="top">
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="./index.html">김현우</a>
      <nav class="site-nav" aria-label="주 메뉴">
        <a href="#about">소개</a>
        <a href="#timeline">타임라인</a>
      </nav>
    </div>
  </header>
  <div class="shell page-layout">
    <aside class="profile" aria-label="프로필">
      <img class="profile-avatar" src="./assets/profile.webp" width="360" height="463" alt="김현우 프로필 사진">
      <div class="profile-copy">
        <p class="profile-name">김현우</p>
        <p class="profile-description">프론트엔드 개발에 관심이 있어요.</p>
        <a class="profile-link" href="https://github.com/Jesse-hyeon">GitHub</a>
      </div>
    </aside>
    <main class="page-main">
      <section class="intro" id="about" aria-labelledby="intro-title">
        <h1 id="intro-title">안녕하세요, 김현우입니다.</h1>
        <p>일상에서 느낀 불편을 웹으로 해결하는 데 관심이 있어요. 수업에서 공간 예약 서비스를 만들었고, 인턴으로 일하며 실제 사용자가 쓰는 화면을 개선하는 경험을 했습니다.</p>
        <p>여기에는 프로젝트와 수상 경험, 밴드와 축구동아리 활동에서 맡은 역할과 배운 점을 시간순으로 모았습니다.</p>
        <p class="sample-note">소개 내용과 타임라인의 경험은 예시입니다.</p>
      </section>
      <section class="timeline-section" id="timeline" aria-labelledby="timeline-title">
        <div class="section-heading">
          <h2 id="timeline-title">타임라인</h2>
          <p>오래된 경험부터 최신 경험까지</p>
        </div>
        <div class="filters" role="group" aria-label="타임라인 필터">
          <button type="button" data-filter="all" aria-pressed="true">전체</button>
          <button type="button" data-filter="career" aria-pressed="false">커리어</button>
          <button type="button" data-filter="award" aria-pressed="false">수상경험</button>
          <button type="button" data-filter="project" aria-pressed="false">프로젝트</button>
        </div>
        <p class="sr-only" id="filter-status" role="status"></p>
        <div id="timeline-list"></div>
        <noscript><p>타임라인을 보려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
      </section>
    </main>
  </div>
  <footer class="site-footer shell"><span>김현우 포트폴리오</span><a href="#top">맨 위로</a></footer>
</body>
</html>
